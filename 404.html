<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://domheim.no/og-image.png">
<meta name="twitter:image" content="https://domheim.no/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<title>Siden finnes ikke — Domheim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--lino:#F4EFE8;--arena:#D8C8B4;--oliva:#5B6B4E;--carbon:#2B2B2B;--ink-soft:#5A534A;--line:rgba(43,43,43,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--lino);color:var(--carbon)}
body{font-family:"Karla",system-ui,sans-serif;line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;
  background:radial-gradient(ellipse 70% 50% at 80% 20%,rgba(216,200,180,.45),transparent 55%),var(--lino)}
main{width:100%;max-width:36rem}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;font-weight:600;letter-spacing:.1em;margin:0;color:var(--carbon);text-decoration:none}
.rubro{margin:.35rem 0 0;color:var(--ink-soft);font-size:.95rem}
.code{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:600;color:var(--oliva);margin:2rem 0 .5rem}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0 0 .5rem;font-size:1.9rem}
p{margin:0 0 1rem;color:var(--ink-soft)}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.btn{display:inline-block;background:var(--oliva);color:var(--lino);text-decoration:none;padding:.85rem 1.4rem;font-weight:600;text-align:center}
.btn:hover,.btn:focus-visible{background:var(--carbon)}
.actions a:not(.btn){color:var(--carbon);text-underline-offset:3px}
.contact{color:var(--ink-soft);font-size:.95rem}
@media (max-width:480px){.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
<meta name="twitter:title" content="Siden finnes ikke — Domheim">
</head>
<body>
<main>
<a class="brand" href="/">Domheim</a>
<p class="rubro">Skap ro hjemme</p>
<div class="code" aria-hidden="true">404</div>
<h1>Siden finnes ikke</h1>
<p>Vi finner ikke denne siden hos Domheim. Den kan være flyttet, eller adressen kan være skrevet feil.</p>
<div class="actions">
<a class="btn" href="/">Til forsiden</a>
<a href="/#shop">Se produktene</a>
<span class="contact">Kontakt: <a href="mailto:kontakt@domheim.no">kontakt@domheim.no</a></span>
</div>
</main>
</body>
</html>
